version: "3.9"

# Minimum-viable observability stack for mini-platform.
#
#   OTel Collector  -- receives OTLP from vLLM, gateway, router
#   Prometheus      -- scrapes vLLM /metrics and DCGM-exporter
#   Tempo           -- traces backend
#   Grafana         -- dashboards
#
# Bring up:    docker compose up -d
# Tear down:   docker compose down
#
# Then point vLLM at otel-collector:4317 and Prometheus scrape config at
# the engine's /metrics endpoint.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4319:4317"   # tempo's OTLP receiver, kept distinct from collector

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./grafana-dashboards/:/var/lib/grafana/dashboards/:ro
