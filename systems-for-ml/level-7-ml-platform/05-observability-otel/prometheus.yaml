global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000   # vLLM engine — adjust to your host
        labels:
          service: vllm

  - job_name: dcgm
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9400   # nvidia-dcgm-exporter
        labels:
          service: dcgm

  - job_name: otel-collector-metrics
    metrics_path: /metrics
    static_configs:
      - targets: [otel-collector:8889]
        labels:
          service: otel
