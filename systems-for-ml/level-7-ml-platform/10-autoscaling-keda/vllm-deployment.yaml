apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
  namespace: ml-platform
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 120   # let in-flight decodes finish
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - "--model=meta-llama/Llama-3.2-1B-Instruct"
            - "--port=8000"
            - "--enable-chunked-prefill"
            - "--scheduling-policy=priority"
            - "--otlp-traces-endpoint=http://otel-collector.observability:4317"
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 24Gi
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          # Critical for graceful drain — sleep gives the router time to remove
          # this pod from candidates before SIGTERM fires.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ml-platform
spec:
  selector: {app: vllm}
  ports:
    - name: http
      port: 8000
      targetPort: http
