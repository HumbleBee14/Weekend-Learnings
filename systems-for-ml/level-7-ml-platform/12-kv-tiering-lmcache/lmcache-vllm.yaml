apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-lmcache
  namespace: ml-platform
spec:
  replicas: 2
  selector:
    matchLabels: {app: vllm-lmcache}
  template:
    metadata:
      labels: {app: vllm-lmcache}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          env:
            # LMCache config — DRAM hot tier, NVMe warm tier, Redis remote tier.
            - name: LMCACHE_CHUNK_SIZE
              value: "256"          # tokens per LMCache chunk; matches vLLM block_size * 16
            - name: LMCACHE_LOCAL_CPU
              value: "True"
            - name: LMCACHE_MAX_LOCAL_CPU_SIZE
              value: "40"           # GiB pinned DRAM
            - name: LMCACHE_LOCAL_DISK
              value: "/var/lib/lmcache/disk"
            - name: LMCACHE_MAX_LOCAL_DISK_SIZE
              value: "200"          # GiB local NVMe
            - name: LMCACHE_REMOTE_URL
              value: "redis://lmcache-redis:6379"
            - name: LMCACHE_REMOTE_SERDE
              value: "naive"
          args:
            - "--model=meta-llama/Llama-3.1-8B-Instruct"
            - "--port=8000"
            - "--enable-chunked-prefill"
            - "--kv-transfer-config={\"kv_connector\":\"LMCacheConnectorV1\",\"kv_role\":\"kv_both\"}"
            - "--otlp-traces-endpoint=http://otel-collector.observability:4317"
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 64Gi
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: lmcache-disk
              mountPath: /var/lib/lmcache/disk
      volumes:
        - name: lmcache-disk
          hostPath:
            path: /mnt/nvme/lmcache
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lmcache-redis
  namespace: ml-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: lmcache-redis}
  template:
    metadata:
      labels: {app: lmcache-redis}
    spec:
      containers:
        - name: redis
          image: redis:7
          args: ["--maxmemory", "64gb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: lmcache-redis
  namespace: ml-platform
spec:
  selector: {app: lmcache-redis}
  ports:
    - port: 6379
      targetPort: 6379
